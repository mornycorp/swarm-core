[workspace]
resolver = "3"
# `xtask`: this repo's own `cargo xtask` (mornycorp/swarm-core#96), Swarm Core by path.
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# GitHub's API replies (`gh api`) and the tracking lines.
serde_json = "1"
# The architecture's checks read manifests and cargo configs (`checks`, `pin`): parse only.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
swarm-core-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
