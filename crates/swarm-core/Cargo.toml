[package]
name = "swarm-core"
description = "The swarm tooling agent swarms share, behind each repo's xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
swarm-core-testkit = { workspace = true }

[lints]
workspace = true

# A fake consumer's `cargo xtask ci`, which the `ci` contract's tests run the gate against
# (docs/ci-contract.md). A consumer builds only the library.
[[bin]]
name = "fake-xtask"
path = "fake/xtask.rs"
test = false
doc = false
