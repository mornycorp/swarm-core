# A starting point from swarm-core's templates (`cargo xtask swarm-core init`): this repo's
# own now. The lint rules of docs/app-architecture.md: the test allowances (the deny headers in
# every crate root cover production code only), the lock rule (Never hang on a lock) and the
# code-health limits.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Never hang on a lock: std's mutex waits for ever on a deadlock. Use the app's own, which errors
# out and names the lock instead: the engine's `lock::Lock` in an app made from the skeleton
# (`crates/engine/src/lock.rs`), which is held only inside `Lock::with`, so it has no guard to keep.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use the app's own lock (the engine's `lock::Lock`), which errors out on a deadlock instead of hanging (docs/app-architecture.md#never-hang-on-a-lock)" },
    { path = "std::sync::MutexGuard", reason = "use the app's own lock (the engine's `lock::Lock::with`), which hands out no guard (docs/app-architecture.md#never-hang-on-a-lock)" },
]

# Code-health limits for production code: every crate root warns on these and allows them under
# cfg(test); the gate's -D warnings makes them errors. A unit over a limit carries
# `#[expect(clippy::…, reason = "…")]`.
cognitive-complexity-threshold = 10
too-many-lines-threshold = 60
too-many-arguments-threshold = 6
